name: Deploy Producao

# Dispara SOMENTE ao criar uma tag de versao (ex.: v1.2.0) ou manualmente pela aba Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Impede dois deploys simultaneos (o segundo espera o primeiro terminar).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Pipeline completo NO RUNNER SELF-HOSTED on-premises (o repo e privado em plano
  # free, entao runners GitHub-hosted nao estao disponiveis). O .NET 8 SDK e o Node ficam
  # PRE-INSTALADOS no servidor (ver o passo Preflight: o egress bloqueia os CDNs).
  #
  # Os testes rodam contra um banco FAKE (ConnectionStrings abaixo aponta para uma
  # instancia inexistente). Como a migracao no start esta em try/catch (Program.cs),
  # a API sobe mesmo sem banco e o /health passa -> os testes NUNCA tocam producao.
  # ---------------------------------------------------------------------------
  build-teste-deploy:
    runs-on: [self-hosted, windows, tracker-prod]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historico completo + tags: o passo final compara com o commit da ultima geracao
          # do agente Windows para saber se ele mudou (e so entao o regera).
          fetch-depth: 0
          fetch-tags: true

      # O egress da rede bloqueia o CDN de download da Microsoft/Node, entao NAO usamos
      # setup-dotnet/setup-node. O .NET 8 SDK e o Node ficam PRE-INSTALADOS no servidor.
      # (Apos instalar, reinicie o servico do runner para ele enxergar as novas ferramentas.)
      - name: Preflight (ferramentas instaladas no runner)
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command dotnet -ErrorAction SilentlyContinue)) { throw "Falta o .NET 8 SDK no runner. Instale-o e reinicie o servico do runner." }
          if (-not (Get-Command node   -ErrorAction SilentlyContinue)) { throw "Falta o Node.js no runner. Instale-o e reinicie o servico do runner." }
          Write-Host ("dotnet: " + (dotnet --version))
          Write-Host ("node:   " + (node --version))
          Write-Host ("npm:    " + (npm --version))

      - name: Restore
        run: dotnet restore Tracker.sln

      - name: Build (Release)
        run: dotnet build Tracker.sln -c Release --no-restore

      - name: Testes (bloqueia o deploy se algum falhar)
        env:
          # Chave AES-256 DESCARTAVEL, exclusiva do CI. Nao e um segredo de producao.
          Encryption__CpfKeyBase64: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          # Banco FAKE: instancia inexistente + timeout curto. Garante que o teste
          # jamais alcance o banco de producao configurado na maquina.
          ConnectionStrings__TrackerDb: 'Server=localhost\CI_INEXISTENTE;Database=Tracker_CI_DUMMY;Trusted_Connection=True;Connect Timeout=2;TrustServerCertificate=True'
        run: dotnet test Tracker.sln -c Release --no-build --logger "trx;LogFileName=testes.trx"

      # ---------------------------------------------------------------------------
      # node_modules vem de um cache LOCAL do servidor (fora do workspace), porque o
      # 'git clean -ffdx' do actions/checkout apaga a pasta a cada run e o npm install
      # resultante custava ~9 min - 76% do deploy inteiro.
      #
      # A chave do cache e o hash do package-lock.json: lock igual => dependencias iguais
      # => restaura a copia (~30s); lock alterado => nao existe pasta com esse hash =>
      # instala do zero e semeia o cache novo. E impossivel reaproveitar um cache
      # desatualizado. O passo roda DEPOIS dos testes, para nao gastar tempo se eles falharem.
      #
      # Nao usamos actions/cache: ele trafega pelo servico de cache do GitHub e o egress
      # deste runner e restrito (mesmo motivo de nao usarmos setup-node).
      # ---------------------------------------------------------------------------
      - name: Restaurar node_modules (cache local do servidor)
        run: |
          $ErrorActionPreference = 'Stop'
          $cronometro = [System.Diagnostics.Stopwatch]::StartNew()
          $web       = Join-Path $env:GITHUB_WORKSPACE 'src\Tracker.Web'
          $destino   = Join-Path $web 'node_modules'
          $raizCache = if ($env:TRACKER_CI_CACHE) { $env:TRACKER_CI_CACHE } else { 'C:\TrackerCI' }
          $hash      = (Get-FileHash (Join-Path $web 'package-lock.json') -Algorithm SHA256).Hash.Substring(0, 16)
          $cache     = Join-Path $raizCache "node_modules-$hash"
          # Distingue "o lock mudou" de "primeira execucao": se ja existe cache de ALGUM outro
          # lock, a ausencia do nosso significa que as dependencias foram alteradas.
          $jaHaviaCache = @(Get-ChildItem $raizCache -Directory -Filter 'node_modules-*' -ErrorAction SilentlyContinue).Count -gt 0

          # O marcador '.ok' so e gravado depois que a copia termina: um cache interrompido
          # no meio nao tem marcador e e reinstalado em vez de restaurado pela metade.
          if (Test-Path (Join-Path $cache '.ok')) {
            Write-Host "Cache encontrado ($hash). Restaurando node_modules..."
            robocopy $cache $destino /MIR /MT:16 /XF .ok /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy falhou ao restaurar o cache (codigo $LASTEXITCODE)." }
            # Marca o cache como usado AGORA: restaurar so le, e sem isto a poda mais abaixo
            # (que ordena por data) poderia apagar justamente o cache em uso.
            (Get-Item $cache).LastWriteTime = Get-Date
            $resumo = "Cache reaproveitado (hash $hash). Nenhum 'npm install' foi necessario."
          } else {
            $motivo = if ($jaHaviaCache) { "package-lock.json ALTERADO" } else { "primeira execucao com cache" }
            Write-Host "Sem cache para $hash ($motivo). Instalando as dependencias (demora ~9 min)..."
            Push-Location $web
            try {
              npm ci --prefer-offline --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw "npm ci falhou (codigo $LASTEXITCODE)." }
            } finally { Pop-Location }
            robocopy $destino $cache /MIR /MT:16 /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy falhou ao semear o cache (codigo $LASTEXITCODE)." }
            New-Item -ItemType File (Join-Path $cache '.ok') -Force | Out-Null
            Write-Host "Cache semeado em $cache."
            $resumo = "$motivo. Dependencias reinstaladas do zero e cache renovado (hash $hash)."
          }

          # Mantem apenas os 3 caches mais recentes (cada um ocupa algumas centenas de MB).
          Get-ChildItem $raizCache -Directory -Filter 'node_modules-*' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -Skip 3 |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          # Registra o que aconteceu na pagina do run (aba Actions), sem precisar abrir o log.
          $cronometro.Stop()
          $linhas = @(
            '### Dependencias do site (node_modules)',
            '',
            $resumo,
            '',
            ("Tempo deste passo: " + [int]$cronometro.Elapsed.TotalSeconds + "s.")
          )
          Write-Host ($linhas -join [Environment]::NewLine)
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $linhas }

          # O robocopy usa 0-7 para sucesso (1 = arquivos copiados). Sem este exit explicito,
          # o wrapper do Actions leria o $LASTEXITCODE=1 do robocopy e falharia o passo.
          exit 0

      - name: Gerar pacote (site + API)
        # -SemBuild: o passo "Build (Release)" acima ja compilou a solucao inteira nesta
        # mesma copia do codigo; sem ele o publish repetia restore + build da API.
        run: .\deploy\publicar-servidor.ps1 -Saida "$env:GITHUB_WORKSPACE\publish" -SemBuild

      - name: Publicar no IIS (producao)
        # Sem -Destino: o script publica na pasta real que o site 'Tracker' serve (PhysicalPath do IIS).
        run: .\deploy\atualizar-servidor.ps1 -Origem "$env:GITHUB_WORKSPACE\publish" -Site "Tracker"

      # ---------------------------------------------------------------------------
      # Regera o instalador do agente Windows SO quando o codigo do agente mudou desde a
      # ULTIMA GERACAO BEM-SUCEDIDA (nao desde a tag anterior: se a release anterior falhou
      # antes de gerar o agente, o diff contra a tag pularia a regeracao e o instalador ficaria
      # velho para sempre). O commit gerado fica em ultima-geracao.txt no destino, gravado so
      # no fim. Sem o .exe ou sem o marcador, regera. Roda DEPOIS do deploy: uma falha aqui nao
      # desfaz o site ja publicado. O .exe embute a EnrollmentKey de producao, entao fica numa
      # pasta do servidor acessivel so pela TI (NUNCA no wwwroot).
      # ---------------------------------------------------------------------------
      - name: Gerar agente Windows (se o agente mudou)
        # A EnrollmentKey vem da variavel de ambiente da MAQUINA do runner (mesma da API de
        # producao), herdada automaticamente pelo step - nao declare via contexto do Actions
        # (viria vazia e sobrescreveria a real).
        run: |
          $ErrorActionPreference = 'Stop'

          # Exe nativo com preference 'Stop' no PS 5.1: o stderr (ex.: "fatal: ..." do git) vira
          # erro TERMINANTE e mata o passo antes da checagem. Baixa o preference so em volta da
          # chamada e devolve o codigo de saida para quem chamou decidir.
          function Invocar-Nativo([scriptblock]$Bloco) {
            $anterior = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try { $saida = & $Bloco 2>$null } finally { $ErrorActionPreference = $anterior }
            return [pscustomobject]@{ Codigo = $LASTEXITCODE; Saida = $saida }
          }

          # Defaults de producao; sobrescreva com variaveis de ambiente no runner se precisar.
          $backend = if ($env:TRACKER_BACKEND_URL) { $env:TRACKER_BACKEND_URL } else { 'https://tracker.foodsacademy.com.br' }
          $destino = if ($env:TRACKER_AGENTE_DIST) { $env:TRACKER_AGENTE_DIST } else { 'C:\TrackerAgentDist' }
          $exeAtual = Join-Path $destino 'Instalar-Agente.exe'
          $marcador = Join-Path $destino 'ultima-geracao.txt'
          $commit = "${{ github.sha }}"
          $tag = "${{ github.ref_name }}"
          $caminhosAgente = @('agents/Tracker.Agent.Windows', 'deploy/gerar-pendrive.ps1', 'deploy/Instalador')

          $motivo = $null
          if (-not (Test-Path $exeAtual)) {
            $motivo = "Instalar-Agente.exe ausente em $destino"
          } elseif (-not (Test-Path $marcador)) {
            $motivo = "sem marcador da ultima geracao ($marcador)"
          } else {
            # 1a linha do marcador = commit da ultima geracao bem-sucedida.
            $base = ((Get-Content $marcador -TotalCount 1) | Out-String).Trim()
            $existe = Invocar-Nativo { git cat-file -e "$base^{commit}" }
            if ([string]::IsNullOrWhiteSpace($base) -or $existe.Codigo -ne 0) {
              $motivo = "commit da ultima geracao ('$base') nao encontrado no historico"
            } else {
              $diff = Invocar-Nativo { git diff --name-only "$base" "$commit" -- $caminhosAgente }
              if ($diff.Codigo -ne 0) {
                $motivo = "git diff falhou (codigo $($diff.Codigo)) contra $base"
              } elseif (-not [string]::IsNullOrWhiteSpace(($diff.Saida | Out-String))) {
                $motivo = "agente mudou desde a ultima geracao ($base)"
              }
            }
          }

          if (-not $motivo) {
            Write-Host "Agente inalterado desde a ultima geracao; pulando."
            exit 0
          }
          Write-Host "Gerando o agente: $motivo."

          $chave = $env:Enrollment__CompanyKey
          if ([string]::IsNullOrWhiteSpace($chave)) {
            throw "Enrollment__CompanyKey ausente no runner. Configure a variavel de ambiente da maquina (mesma da API)."
          }

          # O gerar-pendrive.ps1 roda no mesmo processo e lanca excecao em qualquer falha.
          .\deploy\gerar-pendrive.ps1 -Destino $destino -BackendUrl $backend -EnrollmentKey $chave -Tipo Notebook

          # Mantem o 'Instalar-Agente.exe' (ultimo) e uma copia versionada pela tag.
          Copy-Item $exeAtual (Join-Path $destino ("Instalar-Agente-" + $tag + ".exe")) -Force

          # Marcador gravado POR ULTIMO: so existe se tudo acima deu certo.
          Set-Content -Path $marcador -Value @($commit, $tag, (Get-Date -Format 'dd/MM/yyyy HH:mm:ss')) -Encoding ASCII
          Write-Host ("Agente gerado em " + $destino + ": Instalar-Agente.exe e Instalar-Agente-" + $tag + ".exe (commit " + $commit + ")")

          # O wrapper do Actions encerra com o $LASTEXITCODE do ultimo exe nativo (ex.: um
          # git cat-file que falhou acima): sem este exit, o passo falharia apos gerar certo.
          exit 0
