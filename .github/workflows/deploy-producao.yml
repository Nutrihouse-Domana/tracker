name: Deploy Producao

# Dispara SOMENTE ao criar uma tag de versao (ex.: v1.2.0) ou manualmente pela aba Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Impede dois deploys simultaneos (o segundo espera o primeiro terminar).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Pipeline completo NO RUNNER SELF-HOSTED on-premises (o repo e privado em plano
  # free, entao runners GitHub-hosted nao estao disponiveis). O setup-dotnet /
  # setup-node baixam as ferramentas no proprio runner (nao precisam estar pre-instaladas).
  #
  # Os testes rodam contra um banco FAKE (ConnectionStrings abaixo aponta para uma
  # instancia inexistente). Como a migracao no start esta em try/catch (Program.cs),
  # a API sobe mesmo sem banco e o /health passa -> os testes NUNCA tocam producao.
  # ---------------------------------------------------------------------------
  build-teste-deploy:
    runs-on: [self-hosted, windows, tracker-prod]
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore
        run: dotnet restore Tracker.sln

      - name: Build (Release)
        run: dotnet build Tracker.sln -c Release --no-restore

      - name: Testes (bloqueia o deploy se algum falhar)
        env:
          # Chave AES-256 DESCARTAVEL, exclusiva do CI. Nao e um segredo de producao.
          Encryption__CpfKeyBase64: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          # Banco FAKE: instancia inexistente + timeout curto. Garante que o teste
          # jamais alcance o banco de producao configurado na maquina.
          ConnectionStrings__TrackerDb: 'Server=localhost\CI_INEXISTENTE;Database=Tracker_CI_DUMMY;Trusted_Connection=True;Connect Timeout=2;TrustServerCertificate=True'
        run: dotnet test Tracker.sln -c Release --no-build --logger "trx;LogFileName=testes.trx"

      - name: Gerar pacote (site + API)
        run: .\deploy\publicar-servidor.ps1 -Saida "$env:GITHUB_WORKSPACE\publish"

      - name: Publicar no IIS (producao)
        run: .\deploy\atualizar-servidor.ps1 -Origem "$env:GITHUB_WORKSPACE\publish" -Destino "C:\Tracker" -Site "Tracker"
